<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>嗜血博士 · 幽灵船副本 | 无限流互动游戏</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: #1a100c;
            background-image: radial-gradient(circle at 10% 20%, #2c1e16, #0f0a07);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', '宋体', 'Segoe UI', monospace;
            padding: 20px;
            margin: 0;
        }
        .game-container {
            max-width: 650px;
            width: 100%;
            background: #fef3e2;
            background-image: linear-gradient(145deg, #fff2e0 0%, #f7e5d3 100%);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,200,0.8);
            overflow: hidden;
            border: 1px solid #c9ab81;
        }
        .game-panel {
            padding: 20px 24px 28px;
            position: relative;
        }
        .game-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" opacity="0.08"><path d="M0 0 L400 0 L400 300 L0 300 Z" fill="none" stroke="%238b5a2b" stroke-width="0.5"/><circle cx="50" cy="80" r="12" fill="none" stroke="%238b5a2b"/><circle cx="320" cy="210" r="18" fill="none" stroke="%238b5a2b"/><path d="M120 240 L180 200 L250 230" stroke="%238b5a2b" fill="none"/></svg>');
            background-repeat: repeat;
            pointer-events: none;
        }
        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin: 0 0 8px 0;
            color: #3e2a1f;
            letter-spacing: 2px;
            font-family: 'Times New Roman', serif;
            text-shadow: 2px 2px 0 #d9c2a7;
        }
        .sub {
            text-align: center;
            font-size: 0.8rem;
            color: #7c5f3a;
            border-bottom: 1px dashed #ccb38c;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .stats {
            background: #2a2218e0;
            background: #2c241b;
            border-radius: 60px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            color: #fbeccd;
            font-weight: bold;
            margin-bottom: 24px;
            font-size: 0.9rem;
            backdrop-filter: blur(2px);
            border: 1px solid #ad8b62;
        }
        .stat { background: #00000055; padding: 4px 12px; border-radius: 40px; }
        .scene-card {
            background: #fef1e0;
            border-radius: 28px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 1px #fff9ef, 0 8px 18px rgba(0,0,0,0.2);
            border: 1px solid #dabb9a;
        }
        .scene-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #6b3f1c;
            border-left: 6px solid #9b2e1e;
            padding-left: 14px;
            margin-bottom: 12px;
        }
        .scene-desc {
            font-size: 0.95rem;
            line-height: 1.45;
            color: #2e241d;
            background: #fff6ec;
            padding: 12px 14px;
            border-radius: 20px;
            margin-bottom: 18px;
            border: 1px solid #e7cfb5;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: #fef7e8;
            border: 1px solid #ccaa7b;
            border-radius: 30px;
            padding: 12px 18px;
            color: #3e2a1f;
            font-weight: bold;
            font-family: monospace;
            font-size: 0.9rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: none;
            text-shadow: none;
        }
        .option-btn:hover {
            background: #f5e6d0;
            transform: translateY(-1px);
        }
        .option-btn:active {
            transform: translateY(1px);
        }
        .map-btn {
            background: #5c3e2a;
            border: 1px solid #9b7a56;
            color: #fae2bf;
            font-weight: bold;
        }
        .map-btn:hover {
            background: #6e4f38;
        }
        .option-btn.disabled, .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            background: #9e8b78;
            border-color: #7a634b;
            color: #ddd0c0;
        }
        .clues-area {
            background: #e6d4bd;
            border-radius: 28px;
            padding: 12px 18px;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #2e241d;
            border: 1px solid #c6a87f;
        }
        .clue-title { font-weight: bold; display: flex; justify-content: space-between; border-bottom: 1px solid #b4916a; margin-bottom: 8px; padding-bottom: 4px; }
        .clue-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        .clue-badge { background: #36281d; color: #fae6cf; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; }
        .combo-list { margin-top: 10px; border-top: 1px dashed #b4916a; padding-top: 8px; }
        .combo-title { font-weight: bold; margin-bottom: 4px; }
        .combo-record { font-size: 0.7rem; color: #4a2a1a; margin-left: 8px; list-style: none; padding-left: 0; }
        .combo-record li { margin-bottom: 2px; }
        .reset-btn {
            background: #423524;
            width: 100%;
            margin-top: 20px;
            color: #f0dbc0;
            border: none;
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .reset-btn:hover { background: #5c4330; transform: scale(0.98); }
        footer { font-size: 0.65rem; text-align: center; color: #9b845e; margin-top: 10px; }
        .special-note { font-size: 0.7rem; margin-top: 8px; color: #9b4b2c; }
        .ending-text { white-space: pre-line; }
        .memory-btn { background: #7a3a28; border-color: #e6b17e; color: #ffe0b5; text-align: center; }
    </style>
</head>
<body>
<div class="game-container" id="gameRoot">
    <div class="game-panel">
        <h1>🩸 嗜血博士 · 幽灵船副本</h1>
        <div class="sub">「真相淹没在无尽的深海里」</div>
        <div class="stats" id="statPanel">
            <span class="stat">🧠 理智(SAN): <span id="sanVal">10</span></span>
            <span class="stat">🔍 真相(TRUTH): <span id="truthVal">0</span></span>
            <span class="stat">⚡ 行动点(AP): <span id="apVal">6</span></span>
        </div>
        <div id="dynamicScene"></div>
        <div class="clues-area">
            <div class="clue-title">📜 线索记录</div>
            <div id="clueListArea" class="clue-list">暂无线索</div>
            <div class="combo-list">
                <div class="combo-title">🔗 组合记录</div>
                <ul id="comboRecordArea" class="combo-record"></ul>
            </div>
            <div class="special-note">💡 获得新线索时会自动组合，真相值自动增加。</div>
        </div>
        <button id="resetGameBtn" class="reset-btn">🔄 重开游戏</button>
        <footer>选择消耗行动点，理智归零或真相过低将触发结局。真相≥5可进入记忆孤岛。</footer>
    </div>
</div>

<script>
    // ------------------- 游戏核心 -------------------
    let gameState = {
        san: 10,
        truth: 0,
        ap: 6,
        clues: [],
        usedCombos: [],
        specialFlags: [],
        currentScene: "intro",
        gameOver: false,
    };
    let comboRecords = [];

    const clueNames = {
        ring: "烧焦的戒指",
        bloodstain: "人形血迹",
        button: "船员纽扣",
        shelley: "雪莱的诗",
        illness: "伊莲娜的病",
        phantom_elena: "伊莲娜的幻影",
        wind_chime: "风铃",
        martha_name: "玛莎的真名",
        edward_gift: "爱德华的礼物",
        waltz_stain: "小丑之王的回忆",
        martha_call: "玛莎的呼唤",
        lip_print: "唇印",
        gramophone: "留声机音乐",
        menu_secret: "走私酒",
        apology: "未说出口的道歉",
        smile_corpse: "无名女尸",
        scalpel: "手术刀",
        paper_report: "碎纸报告",
        black_witchcraft: "传说中的黑巫术",   // 新增
        self_id: "自我认同",
        split_id: "人格分裂",
        equation: "涂鸦的秘密",
        reflection: "书中的自白",
        double_confess: "双重谋杀的自白",
        rosemary_meaning: "迷迭香",
        erased_face: "被抹去的面孔",
        shared_table: "共享的餐桌",
        martha_sacrifice: "玛莎的牺牲",
        boiler_confess: "锅炉房的忏悔",
        substitute_know: "替代品的自知",
        usurp_evidence: "盗用身份的证据",
        same_person: "同一个人",
        never_hate: "她从不恨任何人",
        last_waltz: "最后的华尔兹",
        family_lie: "谎言",
        handwriting_same: "同一人笔迹"
    };
    const truthClues = Object.keys(clueNames);

    function hasClue(id) { return gameState.clues.some(c => c.id === id); }
    function hasSpecialFlag(flag) { return gameState.specialFlags.includes(flag); }
    function addSpecialFlag(flag) { if (!hasSpecialFlag(flag)) gameState.specialFlags.push(flag); }

    function addComboRecord(desc) {
        comboRecords.unshift(desc);
        if (comboRecords.length > 10) comboRecords.pop();
        updateComboUI();
    }
    function updateComboUI() {
        const comboUl = document.getElementById("comboRecordArea");
        if (comboRecords.length === 0) comboUl.innerHTML = "<li style='color:#8a6e4e;'>暂无组合</li>";
        else comboUl.innerHTML = comboRecords.map(rec => `<li>✨ ${rec}</li>`).join("");
    }

    function autoCombo() {
        const comboPairs = [
            { a: "ring", b: "paper_report", desc: "戒指 + 碎纸报告" },
            { a: "lip_print", b: "phantom_elena", desc: "唇印 + 伊莲娜幻影" },
            { a: "shelley", b: "waltz_stain", desc: "雪莱的诗 + 小丑之王的回忆" },
            { a: "rosemary_meaning", b: "martha_name", desc: "迷迭香 + 玛莎的真名" },
            { a: "scalpel", b: "bloodstain", desc: "手术刀 + 人形血迹" },
            { a: "wind_chime", b: "edward_gift", desc: "风铃 + 爱德华的礼物" },
            { a: "gramophone", b: "last_waltz", desc: "留声机音乐 + 最后的华尔兹" },
            { a: "martha_sacrifice", b: "wind_chime", desc: "玛莎的牺牲 + 风铃" },
            { a: "boiler_confess", b: "double_confess", desc: "锅炉房的忏悔 + 双重谋杀的自白" }
        ];
        let any = false;
        let msgs = [];
        for (let p of comboPairs) {
            const key = p.a + "_" + p.b;
            if (gameState.usedCombos.includes(key)) continue;
            if (hasClue(p.a) && hasClue(p.b)) {
                gameState.truth += 2;
                gameState.usedCombos.push(key);
                any = true;
                msgs.push(`✨ ${p.desc} → 真相值 +2`);
                addComboRecord(`${p.desc} → 真相+2`);
            }
        }
        if (any) {
            alert(msgs.join("\n"));
            updateUI();
            checkAutoEnding();
        }
    }

    function addClue(id) {
        if (hasClue(id)) return false;
        gameState.clues.push({ id, name: clueNames[id] || id });
        if (truthClues.includes(id)) gameState.truth += 1;
        updateUI();
        autoCombo();
        return true;
    }

    function updateUI() {
        document.getElementById("sanVal").innerText = gameState.san;
        document.getElementById("truthVal").innerText = gameState.truth;
        document.getElementById("apVal").innerText = gameState.ap;
        const container = document.getElementById("clueListArea");
        if (gameState.clues.length === 0) container.innerHTML = "暂无线索";
        else container.innerHTML = gameState.clues.map(c => `<span class="clue-badge">${c.name}</span>`).join("");
        if (!gameState.gameOver) renderCurrentScene();
    }

    function checkAutoEnding() {
        if (gameState.gameOver) return;
        if (gameState.san <= 0) { triggerEnding("mad"); return; }
        if (gameState.ap <= 0) {
            if (gameState.truth >= 5 && gameState.currentScene !== "scene08") {
                alert("行动点耗尽，但真相已足够，你被吸入记忆孤岛...");
                gameState.currentScene = "scene08";
                renderCurrentScene();
                return;
            } else if (gameState.truth < 5) {
                triggerEnding("cycle");
                return;
            }
        }
        if (gameState.truth <= 3 && (gameState.currentScene === "scene06" || gameState.currentScene === "scene08")) {
            triggerEnding("evil");
            return;
        }
        if (gameState.currentScene === "scene08" && gameState.truth < 5 && !gameState.gameOver) {
            triggerEnding("ocean");
        }
    }

    function triggerEnding(type) {
        if (gameState.gameOver) return;
        gameState.gameOver = true;
        let html = "";
        switch(type) {
            case "waltz": html = `<div class="scene-card"><div class="scene-title">⚡ 结局：电椅的华尔兹</div><div class="scene-desc ending-text">你坐上电椅，电流化作华尔兹旋律。你死前最后听到的是：“最亮的地方，玛莎，我们到了。”</div></div>`; break;
            case "dinner": html = `<div class="scene-card"><div class="scene-title">🍲 结局：永不醒来的晚餐</div><div class="scene-desc ending-text">你回到温馨小家，妻子为你盛汤。碗里的汤永远喝不完——你困在幸福循环中。</div></div>`; break;
            case "ocean": html = `<div class="scene-card"><div class="scene-title">🌊 结局：海洋之露的沉眠</div><div class="scene-desc ending-text">你沉入黑色水面，无数鱼群包围你。你成为风铃的一部分，永远摇曳在海面上。</div></div>`; break;
            case "true": html = `<div class="scene-card"><div class="scene-title">✨ 真结局：真相的出口</div><div class="scene-desc ending-text">你喊出真相，爱德华与乔纳森融合。幽灵船消失，海面只剩迷迭香飘散。你走出梦境，睁开眼睛——你决定去自首。</div></div>`; break;
            case "evil": html = `<div class="scene-card"><div class="scene-title">👻 坏结局：被伯爵吞噬</div><div class="scene-desc ending-text">你无法认清真相，伯爵的怨灵附身。你将永远在船上重复杀人与被杀的循环。</div></div>`; break;
            case "mad": html = `<div class="scene-card"><div class="scene-title">🧠 疯癫结局：永远的13号病人</div><div class="scene-desc ending-text">你彻底崩溃，蜷缩在地牢角落，不断重复：“诺斯费拉图……诺斯费拉图……”</div></div>`; break;
            case "cycle": html = `<div class="scene-card"><div class="scene-title">🔄 循环结局：又是9月的第三个星期</div><div class="scene-desc ending-text">你没能找到真相，船钟敲响，一切重置。记忆再次被抹去，游戏可以重开。</div></div>`; break;
            case "soul": html = `<div class="scene-card"><div class="scene-title">🤝 隐藏结局：灵魂合一</div><div class="scene-desc ending-text">爱德华、玛莎、乔纳森的幻影在海面共舞。你被允许离开，带着他们的祝福。</div></div>`; break;
            case "newcount": html = `<div class="scene-card"><div class="scene-title">👑 隐藏结局：成为新的伯爵</div><div class="scene-desc ending-text">你选择取代爱德华，成为新的“伯爵”。你戴上戒指，坐进头等舱，等待下一个无辜的少女。轮回继续。</div></div>`; break;
            default: html = `<div class="scene-card">游戏结束</div>`;
        }
        document.getElementById("dynamicScene").innerHTML = html;
    }

    function consumeAp() {
        if (gameState.ap <= 0) {
            checkAutoEnding();
            return false;
        }
        gameState.ap--;
        updateUI();
        return true;
    }

    function renderCurrentScene() {
        if (gameState.gameOver) return;
        const scene = gameState.currentScene;
        if (scene === "intro") renderIntro();
        else if (scene === "map") renderMap();
        else if (scene === "scene01") renderScene01();
        else if (scene === "scene02") renderScene02();
        else if (scene === "scene03") renderScene03();
        else if (scene === "scene04") renderScene04();
        else if (scene === "scene05") renderScene05();
        else if (scene === "scene06") renderScene06();
        else if (scene === "scene07") renderScene07();
        else if (scene === "scene08") renderScene08();
        else renderMap();
    }

    function gotoMap() { gameState.currentScene = "map"; renderCurrentScene(); }

    function renderIntro() {
        const html = `<div class="scene-card"><div class="scene-title">🕯️ 进入幽灵船</div>
        <div class="scene-desc">你睁开眼，发现自己站在一艘废弃邮轮的甲板上。海面漆黑，风里带着咸涩。远处隐约有灯光，但分不清是船灯还是鬼火。<br><br>一个声音在你脑中回响：“找到真相，否则永远无法离开。”</div>
        <div class="options"><button class="option-btn" id="introBtn">⛵ 踏上甲板</button></div></div>`;
        document.getElementById("dynamicScene").innerHTML = html;
        document.getElementById("introBtn")?.addEventListener("click", () => {
            gameState.currentScene = "map";
            renderCurrentScene();
        });
    }

    function renderMap() {
        let html = `<div class="scene-card"><div class="scene-title">🗺️ 幽灵船甲板 · 区域选择</div>
        <div class="scene-desc">行动点剩余：${gameState.ap}，理智：${gameState.san}，真相：${gameState.truth}<br>选择区域探索（每次消耗1行动点）</div>
        <div class="options">
            <button class="option-btn map-btn" data-scene="scene01">🔥 锅炉房</button>
            <button class="option-btn map-btn" data-scene="scene02">🛏️ 头等舱客房</button>
            <button class="option-btn map-btn" data-scene="scene03">🌊 甲板</button>
            <button class="option-btn map-btn" data-scene="scene04">🍸 三等舱酒吧</button>
            <button class="option-btn map-btn" data-scene="scene05">🔪 解剖室</button>`;
        const canDungeon = (gameState.truth >= 3 || hasClue("ring"));
        if (canDungeon) html += `<button class="option-btn map-btn" data-scene="scene06">⛓️ 地牢/精神病院</button>`;
        else html += `<button class="option-btn map-btn disabled" disabled>⛓️ 地牢（需真相≥3或戒指）</button>`;
        const canHome = hasClue("shelley");
        if (canHome) html += `<button class="option-btn map-btn" data-scene="scene07">🏠 温馨小家</button>`;
        else html += `<button class="option-btn map-btn disabled" disabled>🏠 小家（需获得雪莱的诗）</button>`;
        if (gameState.truth >= 5 && !gameState.gameOver) html += `<button id="memoryBtn" class="option-btn map-btn memory-btn">🌌 前往记忆孤岛（真相已足）</button>`;
        html += `</div></div>`;
        document.getElementById("dynamicScene").innerHTML = html;
        document.querySelectorAll(".map-btn[data-scene]").forEach(btn => {
            btn.addEventListener("click", (e) => {
                if (gameState.gameOver) return;
                if (!consumeAp()) return;
                gameState.currentScene = btn.getAttribute("data-scene");
                renderCurrentScene();
            });
        });
        const memoryBtn = document.getElementById("memoryBtn");
        if (memoryBtn) memoryBtn.onclick = () => { gameState.currentScene = "scene08"; renderCurrentScene(); };
    }

    // 锅炉房
    function renderScene01() {
        if (!hasSpecialFlag("visited_boiler")) addSpecialFlag("visited_boiler");
        const html = `<div class="scene-card"><div class="scene-title">🔥 锅炉房</div>
        <div class="scene-desc">炽热的气浪夹杂煤灰。巨大锅炉透出暗红火光，地上散落焦黑碎布，墙角有深色污渍，锅炉门半开，内壁有白色灰烬。</div>
        <div class="options">
            <button id="optA" class="option-btn">A. 捡起地上的戒指</button>
            <button id="optB" class="option-btn">B. 查看墙角的污渍</button>
            <button id="optC" class="option-btn">C. 打开锅炉门</button>
            <button id="optD" class="option-btn">D. 离开</button>
        </div></div>`;
        document.getElementById("dynamicScene").innerHTML = html;
        document.getElementById("optA").onclick = () => { addClue("ring"); gameState.san--; updateUI(); gotoMap(); };
        document.getElementById("optB").onclick = () => {
            if (hasClue("scalpel")) { addClue("bloodstain"); gameState.san--; alert("获得人形血迹"); }
            else alert("没有手术刀，无法深入");
            gotoMap();
        };
        document.getElementById("optC").onclick = () => {
            if (Math.random() < 0.5) { addClue("button"); gameState.san--; alert("正面！获得船员纽扣，轻微烫伤"); }
            else { gameState.san -= 2; alert("背面！严重烫伤"); }
            gotoMap();
        };
        document.getElementById("optD").onclick = () => gotoMap();
        if (hasClue("rosemary_meaning") && gameState.truth >= 2 && !hasClue("martha_sacrifice")) {
            addClue("martha_sacrifice");
